server.port=8080
app.timezone=UTC
spring.application.name=population-denominator-service

# MULTIPART CONFIG
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# DATABASE CONFIG
# Postgres backs the result cache (see pdi.cache) and the dashboard read API. Defaults match
# docker-compose and .env (pdi/pdi@localhost/pdi). The service still boots and computes if
# the DB is unreachable - the cache simply disables itself (see ResultCacheRepository).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pdi}}
spring.datasource.username=${POSTGRES_USER:pdi}
spring.datasource.password=${POSTGRES_PASSWORD:pdi}
spring.datasource.hikari.pool-name=pdi-db-pool
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=3000
# Never block application startup on the database; connect lazily on first use.
spring.datasource.hikari.initialization-fail-timeout=-1

# RESULT CACHE CONFIG
# Master switch for the Postgres-backed result cache. When off (or the DB is unreachable)
# every request runs the engine fresh, as before.
pdi.cache.enabled=${PDI_CACHE_ENABLED:true}

# ENGINE CONFIG
pdi.engine.python=${PDI_ENGINE_PYTHON:../.venv/Scripts/python.exe}
pdi.engine.workdir=${PDI_ENGINE_WORKDIR:../pdi-batch}
# 0 (or negative) = no cap: first-run raster downloads can take hours. Set a positive
# PDI_ENGINE_TIMEOUT (seconds) only if you want a hard kill.
pdi.engine.timeout-seconds=${PDI_ENGINE_TIMEOUT:0}
# Persist the individual building_footprint layer. On by default so the full documented
# dataset is stored; it only runs on a campaign's first compute (repeats are served from the
# result cache). Set PDI_PERSIST_BUILDINGS=false to skip it if first-run inserts on very
# large countries are too slow.
pdi.engine.persist-buildings=${PDI_PERSIST_BUILDINGS:true}

# ARTIFACT CONFIG
pdi.artifacts.dir=${PDI_ARTIFACTS_DIR:${java.io.tmpdir}/pdi-artifacts}

# CORS CONFIG
# Override with PDI_CORS_ALLOWED_ORIGIN_PATTERNS (comma separated) in deployed environments.
pdi.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# ACTUATOR CONFIG
management.endpoints.web.exposure.include=health,info
